# Baut bei jedem Tag "v*" (z. B. v0.8.0) Installer + portable .exe und lädt sie als GitHub-Release hoch.
# Die installierten Spiele finden das Update dann automatisch.
name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # manuell starten: Actions → Release Windows → Run workflow
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: node build.mjs
      - run: copy dist\index.html desktop\app\index.html && copy dist\launcher.html desktop\app\launcher.html
        shell: cmd
      - run: npm ci
        working-directory: desktop
      - run: npx electron-builder --win nsis portable --x64 --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
