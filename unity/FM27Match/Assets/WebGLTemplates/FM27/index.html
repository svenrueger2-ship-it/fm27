<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FM27 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #07060f; overflow: hidden; }
  #c { width: 100%; height: 100%; display: block; outline: none; }
  #l { position: fixed; inset: 0; display: grid; place-items: center; color: #d8d0ff; font: 600 14px system-ui, sans-serif; background: radial-gradient(80% 60% at 50% 40%, #1c1640, #07060f); }
  #bar { width: 240px; height: 6px; background: #221d3d; border-radius: 4px; overflow: hidden; margin: 12px auto 0; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7c5cff, #3aa0ff); transition: width .2s; }
  small { display: block; text-align: center; opacity: .6; margin-top: 8px; font-weight: 500; }
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="l"><div>FM27 · Unity-3D-Engine lädt …<div id="bar"><i></i></div><small>Beim ersten Start einmalig ca. 15–30 MB</small></div></div>
<script>
  var inst = null, queue = [];
  var post = function (m) { try { (window.parent || window).postMessage({ fm27unity: m }, '*'); } catch (e) { } };
  window.fm27FromUnity = function (s) { try { post(JSON.parse(s)); } catch (e) { } };
  function send(m) { inst.SendMessage('Bridge', m.method, typeof m.payload === 'string' ? m.payload : JSON.stringify(m.payload || {})); }
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || !d.fm27host) return;
    if (inst) send(d.fm27host); else queue.push(d.fm27host);
  });
  var s = document.createElement('script');
  s.src = 'Build/{{{ LOADER_FILENAME }}}';
  s.onload = function () {
    createUnityInstance(document.getElementById('c'), {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(2, window.devicePixelRatio || 1)
    }, function (p) { document.querySelector('#bar i').style.width = Math.round(p * 100) + '%'; post({ type: 'progress', text: String(Math.round(p * 100)) }); })
      .then(function (i) { inst = i; document.getElementById('l').remove(); queue.forEach(send); queue = []; post({ type: 'loaded' }); })
      .catch(function (err) { post({ type: 'error', text: String(err) }); });
  };
  s.onerror = function () { post({ type: 'error', text: 'loader' }); };
  document.body.appendChild(s);
  // standalone test: ?demo runs a demo match
</script>
</body>
</html>
